<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task Hub · Prototype B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{font-family:"Be Vietnam Pro",Inter,system-ui,sans-serif;color:#18181b;background:#fafafa;font-size:16px;line-height:1.6}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button,a,input,textarea,select,summary{outline-offset:4px}button{cursor:pointer;border:1px solid #d4d4d8;background:white;padding:9px 14px;border-radius:7px;color:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px}button:hover{background:#f4f4f5}button:disabled{cursor:not-allowed;opacity:.45}.primary{background:#18181b;color:white;border-color:#18181b}.primary:hover{background:#3f3f46}a{color:inherit}header{background:white;border-bottom:1px solid #e4e4e7}header>div{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:12px 24px}.brand{font-size:15px;font-weight:700;white-space:nowrap}nav{display:flex;gap:4px}nav button{border:0;border-radius:0;background:transparent;font-size:14px;color:#71717a;padding:12px}nav button[aria-current=page]{color:#18181b;border-bottom:2px solid #18181b}.badge{font-size:12px;border:1px solid #e4e4e7;border-radius:5px;padding:3px 8px;color:#52525b;display:inline-flex;align-items:center;gap:6px}.muted,small{color:#71717a}small,.small{font-size:13px}main{max-width:1000px;margin:36px auto;padding:0 24px}h1{font-size:23px;line-height:1.4;margin:14px 0 20px}h2{font-size:16px;margin:0 0 14px}p{margin:8px 0}section,.card{background:white;border:1px solid #e4e4e7;border-radius:10px;padding:24px;margin-bottom:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.gap{margin-top:20px}.next{background:#fafafa;border:1px solid #e4e4e7;padding:12px 16px;border-radius:7px;margin:18px 0}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}.grid>section{margin:0}.check{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid #f4f4f5;font-size:14px}.check input{width:18px;height:18px;accent-color:#18181b}.check:has(input:checked) span{text-decoration:line-through;color:#71717a}progress{width:100%;height:9px;accent-color:#18181b}details{border:1px solid #e4e4e7;border-radius:7px;background:white;margin:12px 0;padding:12px 16px}summary{cursor:pointer;font-size:14px}details>div{padding-top:12px}input:not([type=checkbox]),textarea,select{width:100%;padding:11px;border:1px solid #d4d4d8;border-radius:6px;background:white;color:#18181b}textarea{resize:vertical}label.field{display:block;margin:16px 0}label.field>span{display:block;font-size:14px;font-weight:500;margin-bottom:7px}.tasks{padding:0;overflow:hidden}.task{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 24px;border-bottom:1px solid #eee}.task:last-child{border:0}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}.steps button{color:#71717a;font-size:14px}.steps button[aria-current=step]{border-color:#18181b;color:#18181b;font-weight:600}.notice{background:#f4f4f5;border:1px solid #d4d4d8;border-radius:6px;padding:12px 16px;font-size:14px;margin-bottom:16px}footer{max-width:1000px;margin:40px auto 20px;padding:0 24px;font-size:12px;color:#71717a}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#18181b;color:white;border-radius:8px;max-width:90vw;z-index:10}dialog{border:1px solid #d4d4d8;border-radius:12px;padding:24px;max-width:440px;width:calc(100% - 40px)}dialog::backdrop{background:#0006}svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}[hidden]{display:none!important}.history-item{padding:12px 0;border-bottom:1px solid #eee}.search{max-width:280px}.review{display:grid;grid-template-columns:130px 1fr;gap:12px;font-size:14px}.review dt{color:#71717a}.review dd{margin:0;overflow-wrap:anywhere}.empty{padding:24px;color:#71717a;text-align:center}@media(max-width:700px){header>div{flex-wrap:wrap;gap:6px;padding:12px 16px}nav{order:3;width:100%;justify-content:space-between}nav button{padding:10px 8px}main{margin:20px auto;padding:0 16px}h1{font-size:20px}.grid{grid-template-columns:1fr}section,.card{padding:18px}.row{flex-wrap:wrap}.steps button{font-size:12px;padding:9px 4px}.task{padding:16px}.search{max-width:none}.review{grid-template-columns:1fr;gap:4px}.review dd{margin-bottom:10px}footer{padding:0 16px}}
</style>
<header><div><a class="brand" href="#overview">Homelab Task Hub</a><nav aria-label="Điều hướng"><button data-page="overview">Tổng quan</button><button data-page="resume">Tiếp tục làm</button><button data-page="handoff">Lưu bàn giao</button></nav><span class="badge">Prototype · dữ liệu giả</span></div></header>
<main id="app"></main>
<footer><details><summary>Thử tình huống</summary><div class="actions"><label>Phiên hiện tại <select id="session"><option>Codex · Mac</option><option>Claude · VM</option></select></label><button id="simulate">Giả lập task bị giữ</button><button id="reset">Làm lại demo</button></div><p>Chỉ lưu trong bộ nhớ trang. Tải lại sẽ reset. Không gọi API, Plane hay Hindsight.</p></details><a href="https://stitch.withgoogle.com/projects/14967084553524389024" target="_blank" rel="noopener">Thiết kế B trên Stitch</a></footer>
<dialog id="close-dialog" aria-labelledby="close-title"><h2 id="close-title">Đóng phiên đang giữ?</h2><p class="muted small">Phiên cũ sẽ mất quyền ghi. Checklist và checkpoint đã lưu được giữ nguyên.</p><div class="actions gap"><button id="cancel-close">Hủy</button><button class="primary" id="confirm-close">Đóng phiên cũ</button></div></dialog>
<dialog id="new-dialog" aria-labelledby="new-title"><form id="new-form"><h2 id="new-title">Tạo task</h2><label class="field"><span>Tên task</span><input name="title" maxlength="120" required></label><label class="field"><span>Loại project</span><select name="scope"><option value="personal">Cá nhân</option><option value="work">Công việc</option></select></label><div class="actions gap"><button type="button" id="cancel-new">Hủy</button><button class="primary">Tạo task</button></div></form></dialog>
<div id="message" class="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
const icons={arrow:'<path d="M5 12h14m-7-7 7 7-7 7"/>',lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',play:'<polygon points="6 3 20 12 6 21 6 3"/>',plus:'<path d="M5 12h14M12 5v14"/>',check:'<path d="m9 11 3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>'};
const icon=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[k]}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seed(){return {selected:'LAB-01',session:'Codex · Mac',tasks:[{id:'LAB-01',title:'Thiết lập backup',scope:'personal',owner:null,generation:1,version:7,items:[{text:'Chọn dữ liệu cần lưu',done:true},{text:'Tạo bản backup thử',done:true},{text:'Kiểm tra checksum',done:true},{text:'Khôi phục trên VM thử',done:false},{text:'Ghi hướng dẫn restore',done:false}],history:[{version:7,done:'Đã tạo bản backup thử.',next:'Khôi phục trên VM thử',decision:'Mã hóa trước khi gửi.',evidence:'PR demo #12',blocker:'',private:'Ghi chú cá nhân mẫu',items:[true,true,true,false,false],session:'Claude · VM'}]},{id:'WORK-12',title:'Kiểm tra luồng thanh toán',scope:'work',owner:'Claude · VM',generation:1,version:2,items:[{text:'Chuẩn bị dữ liệu giả',done:true},{text:'Kiểm tra timeout',done:false},{text:'Ghi bằng chứng',done:false}],history:[{version:2,done:'Đã chuẩn bị dữ liệu giả.',next:'Kiểm tra timeout',decision:'',evidence:'',blocker:'',private:'',items:[true,false,false],session:'Claude · VM'}]}]};}
function claim(t,session){if(t.owner&&t.owner!==session)throw Error('Task đang có phiên khác giữ.');if(!t.owner){t.owner=session;t.generation++;t.version++;}return {generation:t.generation,version:t.version};}
function closeOwner(t){t.owner=null;t.generation++;t.version++;}
function checkpoint(t,session,draft,end){if(t.owner!==session||draft.generation!==t.generation)throw Error('Phiên đã mất quyền ghi. Nháp vẫn được giữ.');if(draft.baseVersion!==t.version)throw Error('Task đã thay đổi. Nháp vẫn được giữ.');if(!draft.done.trim()||!draft.next.trim())throw Error('Điền “Đã làm” và “Bước tiếp theo”.');t.version++;t.items.forEach((x,i)=>x.done=draft.items[i]);const saved={version:t.version,done:draft.done.trim(),next:draft.next.trim(),decision:draft.decision,evidence:draft.evidence,blocker:draft.blocker,private:draft.private,items:[...draft.items],session};t.history.push(saved);if(end){t.owner=null;t.generation++;}return saved;}
function selfCheck(){const t=seed().tasks[0];const ticket=claim(t,'A');let denied=false;try{claim(t,'B');}catch{denied=true;}if(!denied)throw Error('Exclusive claim failed');const d={done:'x',next:'y',private:'secret',decision:'',evidence:'',blocker:'',items:t.items.map(x=>x.done),generation:ticket.generation,baseVersion:ticket.version};checkpoint(t,'A',d,false);if(t.owner!=='A'||t.history.length!==2)throw Error('Checkpoint ownership failed');denied=false;try{checkpoint(t,'A',d,false);}catch{denied=true;}if(!denied)throw Error('Stale version accepted');d.baseVersion=t.version;closeOwner(t);claim(t,'B');denied=false;try{checkpoint(t,'A',d,true);}catch{denied=true;}if(!denied)throw Error('Closed owner accepted');d.generation=t.generation;d.baseVersion=t.version;checkpoint(t,'B',d,true);if(t.owner!==null||t.history.at(-1).private!=='secret')throw Error('Handoff failed');return {passed:5};}
window.prototypeChecks=selfCheck();
let state=seed(),page='overview',step=1,filter='all',query='',toastTimer;
const drafts=new Map(),$=s=>document.querySelector(s),task=()=>state.tasks.find(t=>t.id===state.selected);
function draftKey(){return state.session+'|'+state.selected;}
function draft(){const key=draftKey(),t=task();if(!drafts.has(key)){const h=t.history.at(-1);drafts.set(key,{done:'',next:h.next,decision:h.decision,evidence:h.evidence,blocker:h.blocker,private:h.private,items:t.items.map(x=>x.done),generation:t.generation,baseVersion:t.version});}return drafts.get(key);}
function flash(text){clearTimeout(toastTimer);$('#message').textContent=text;$('#message').hidden=false;toastTimer=setTimeout(()=>$('#message').hidden=true,5000);}
function progress(t){return `${t.items.filter(x=>x.done).length}/${t.items.length}`;}
function badge(t){return `<span class="badge">${icon('lock')}${t.scope==='personal'?'Chỉ mình tôi':'Công việc · chưa nối Plane'}</span>`;}
function header(t){return `<div class="row">${badge(t)}<small>${esc(t.id)} · v${t.version}</small></div><h1>${esc(t.title)}</h1>`;}
function navigate(next){if(next==='handoff'&&task().owner!==state.session){flash('Nhận task trước khi lưu bàn giao.');next='resume';}if(next==='handoff'&&page!=='handoff')step=1;page=next;history.replaceState(null,'','#'+next);render();window.scrollTo(0,0);}
function checklist(t,editable){const items=editable?draft().items:t.items.map(x=>x.done);return t.items.map((x,i)=>`<label class="check"><input type="checkbox" data-item="${i}" ${items[i]?'checked':''} ${editable?'':'disabled'}><span>${esc(x.text)}</span></label>`).join('');}
function render(){const t=task(),h=t.history.at(-1),mine=t.owner===state.session;document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',b.dataset.page===page?'page':'false'));$('#session').value=state.session;let html='';
if(page==='overview'){html=`<section>${header(t)}<div class="row small"><span class="muted">Tiến độ</span><strong>${progress(t)} mục</strong></div><progress value="${t.items.filter(x=>x.done).length}" max="${t.items.length}"></progress><div class="next"><strong>Bước tiếp theo:</strong> ${esc(h.next)}</div><div class="row"><button class="primary" data-page="resume">Tiếp tục làm ${icon('arrow')}</button><small>${t.owner?esc(t.owner):'Sẵn sàng nhận'}</small></div></section><div class="row gap"><div class="actions">${[['all','Tất cả'],['personal','Cá nhân'],['work','Công việc']].map(([v,l])=>`<button data-filter="${v}" aria-pressed="${filter===v}" ${filter===v?'class="primary"':''}>${l}</button>`).join('')}</div><button data-action="new">${icon('plus')} Tạo task</button></div><label class="field search"><span>Tìm task / ID</span><input id="search" value="${esc(query)}" placeholder="LAB-01…"></label><section class="tasks">${state.tasks.filter(x=>(filter==='all'||x.scope===filter)&&(x.title+' '+x.id).toLowerCase().includes(query.toLowerCase())).map(x=>`<div class="task"><div><strong>${esc(x.title)}</strong><div class="muted small">${esc(x.id)} · ${progress(x)} · ${x.owner?esc(x.owner):'Sẵn sàng'}</div></div><button data-task="${esc(x.id)}">Mở</button></div>`).join('')||'<div class="empty">Không tìm thấy task.</div>'}</section>`;}
if(page==='resume'){html=`<section>${header(t)}${t.owner&&!mine?`<div class="notice row"><span>${esc(t.owner)} đang giữ task</span><button data-action="manage">Quản lý phiên</button></div>`:''}<div class="row"><div class="actions">${mine?`<button class="primary" data-action="handoff">Lưu bàn giao ${icon('arrow')}</button>`:`<button class="primary" data-action="claim" ${t.owner?'disabled':''}>${icon('play')} Nhận task</button>`}</div><small>${mine?'Bạn đang giữ task':`Checkpoint v${h.version}`}</small></div></section><div class="grid"><section><h2>Checklist</h2>${checklist(t,mine)}</section><section><h2>Bước tiếp theo</h2><p>${esc(h.next)}</p><details><summary>Context gần nhất · v${h.version}</summary><div class="small">${esc(h.done)}${h.blocker?'<p>Blocker: '+esc(h.blocker)+'</p>':''}</div></details></section></div><details><summary>Quyết định & bằng chứng</summary><div class="small"><p>${esc(h.decision)||'Chưa có quyết định.'}</p><p>${esc(h.evidence)||'Chưa có bằng chứng.'}</p></div></details><details><summary>Ghi chú riêng</summary><div class="small">${esc(h.private)||'Chưa có ghi chú.'}</div></details><details id="history"><summary>Lịch sử · ${t.history.length} checkpoint</summary><div>${[...t.history].reverse().map(x=>`<div class="history-item small"><strong>v${x.version} · ${esc(x.session)}</strong><p>${esc(x.done)}</p><p>Tiếp: ${esc(x.next)}</p></div>`).join('')}</div></details>`;}
if(page==='handoff'){const d=draft();html=`<div class="steps" aria-label="Các bước bàn giao">${['Tiến độ','Nội dung','Xác nhận'].map((x,i)=>`<button data-step="${i+1}" aria-current="${step===i+1?'step':'false'}">${i+1}. ${x}</button>`).join('')}</div><section>${header(t)}${step===1?`<h2>Tiến độ phiên này</h2>${checklist(t,true)}<div class="actions gap"><button data-page="resume">Quay lại</button><button class="primary" data-step="2">Tiếp tục ${icon('arrow')}</button></div>`:''}${step===2?`<label class="field"><span>Đã làm</span><textarea id="done" rows="3" maxlength="4000" placeholder="Tóm tắt ngắn…">${esc(d.done)}</textarea></label><label class="field"><span>Bước tiếp theo</span><input id="next" maxlength="1000" value="${esc(d.next)}"></label><details><summary>Thêm chi tiết</summary><div>${[['decision','Quyết định'],['evidence','Bằng chứng / PR'],['blocker','Blocker'],['private','Ghi chú riêng']].map(([k,l])=>`<label class="field"><span>${l}</span><textarea id="${k}" rows="2" maxlength="4000">${esc(d[k])}</textarea></label>`).join('')}</div></details><div class="actions gap"><button data-step="1">Quay lại</button><button class="primary" data-step="3">Kiểm tra ${icon('arrow')}</button></div>`:''}${step===3?`<dl class="review"><dt>Checklist</dt><dd>${d.items.filter(Boolean).length}/${d.items.length}</dd><dt>Đã làm</dt><dd>${esc(d.done)}</dd><dt>Tiếp theo</dt><dd>${esc(d.next)}</dd><dt>Ghi chú riêng</dt><dd>Chỉ lưu nội bộ</dd></dl><div class="actions gap"><button data-step="2">Sửa</button><button data-action="save">Lưu, giữ phiên</button><button class="primary" data-action="finish">Lưu & kết thúc ${icon('check')}</button></div>`:''}</section>`;}
$('#app').innerHTML=html;
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;try{const t=task();if(b.dataset.page)navigate(b.dataset.page);if(b.dataset.task){state.selected=b.dataset.task;step=1;navigate('resume');}if(b.dataset.filter){filter=b.dataset.filter;render();}if(b.dataset.step){if(Number(b.dataset.step)===3&&(!draft().done.trim()||!draft().next.trim())){flash('Điền “Đã làm” và “Bước tiếp theo”.');return;}step=Number(b.dataset.step);render();}const a=b.dataset.action;if(a==='claim'){claim(t,state.session);drafts.delete(draftKey());flash('Đã nhận task.');render();}if(a==='manage')$('#close-dialog').showModal();if(a==='new')$('#new-dialog').showModal();if(a==='handoff'){step=1;navigate('handoff');}if(a==='save'||a==='finish'){const v=checkpoint(t,state.session,draft(),a==='finish');drafts.delete(draftKey());navigate(a==='finish'?'overview':'resume');flash(`Đã lưu checkpoint v${v.version}${a==='finish'?' · phiên đã đóng':' · vẫn giữ phiên'}.`);}}catch(err){flash(err.message);}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='search'){const pos=el.selectionStart;query=el.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos);}else if(['done','next','decision','evidence','blocker','private'].includes(el.id)){draft()[el.id]=el.value;}});
document.addEventListener('change',e=>{if(e.target.dataset.item!==undefined&&task().owner===state.session)draft().items[Number(e.target.dataset.item)]=e.target.checked;});
$('#cancel-close').onclick=()=>$('#close-dialog').close();
$('#confirm-close').onclick=()=>{closeOwner(task());$('#close-dialog').close();flash('Đã đóng phiên cũ. Bạn có thể nhận task.');render();};
$('#session').onchange=e=>{state.session=e.target.value;page='resume';render();};
$('#simulate').onclick=()=>{const t=task();closeOwner(t);claim(t,state.session==='Codex · Mac'?'Claude · VM':'Codex · Mac');page='resume';render();};
$('#reset').onclick=()=>{state=seed();drafts.clear();page='overview';step=1;query='';filter='all';render();flash('Đã reset dữ liệu demo.');};
$('#cancel-new').onclick=()=>$('#new-dialog').close();
$('#new-form').onsubmit=e=>{e.preventDefault();const form=new FormData(e.target),title=String(form.get('title')).trim();if(!title)return;const scope=String(form.get('scope')),id=(scope==='personal'?'LAB-':'WORK-')+(state.tasks.length+20);state.tasks.push({id,title,scope,owner:null,generation:1,version:1,items:[{text:'Xác định bước đầu tiên',done:false}],history:[{version:1,done:'Task mới',next:'Xác định bước đầu tiên',decision:'',evidence:'',blocker:'',private:'',items:[false],session:state.session}]});state.selected=id;e.target.reset();$('#new-dialog').close();navigate('resume');};
render();
</script>
</html>
