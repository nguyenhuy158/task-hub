<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Hub · Chọn bố cục</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="tokens.css">
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 var(--app-font);color:var(--foreground);background:var(--background)}button,input,select,textarea{font:inherit}a{color:inherit}button,a,select{-webkit-tap-highlight-color:transparent}button,.btn{min-height:40px;padding:9px 16px;border:1px solid var(--border-strong);border-radius:12px;background:var(--surface);color:var(--foreground);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;font-weight:500;line-height:1.4}button:hover,.btn:hover{background:var(--button-hover-surface)}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}.primary:hover{background:var(--primary-hover)}:focus-visible{outline:2px solid var(--primary);outline-offset:3px}svg{width:18px;height:18px;stroke-width:1.75;flex-shrink:0}.muted,small{color:var(--muted)}small{font-size:12px}.review{background:var(--surface);padding:12px 28px;border-bottom:1px solid var(--border-strong);display:flex;gap:12px;align-items:center;flex-wrap:wrap}.review label{display:flex;align-items:center;gap:8px;font-size:12px}.review strong{margin-right:8px}.review select{min-height:36px;border:1px solid var(--border-strong);border-radius:8px;padding:5px 28px 5px 10px;background:var(--surface);max-width:100%}.switch{display:flex;gap:4px}.switch a{min-height:36px;padding:6px 12px}.switch [aria-current=page]{background:var(--secondary);font-weight:600}.review-note{margin:0 0 0 auto;font-size:12px;color:var(--muted)}.shell{max-width:1280px;margin:auto;padding:28px 40px 48px}.brand{display:flex;gap:9px;align-items:center;font-weight:600}.apphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand svg{width:24px;height:24px}.titlebar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}h1{font-size:24px;line-height:1.4;font-weight:600;margin:0}h2{font-size:20px;font-weight:600;line-height:1.5;margin:0}h3{font-size:14px;font-weight:600;margin:0 0 12px}p{margin:0}.workspace{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}.workspace>*{min-width:0}.list{background:var(--surface);border-radius:16px;overflow:hidden}.listhead{padding:20px 20px 8px;display:flex;justify-content:space-between;align-items:center}.filters{display:flex;gap:4px;padding:12px 16px}.filters button{background:transparent;border:0;font-size:12px;padding:8px 10px;min-height:36px}.filters .active{background:var(--secondary)}.row{display:block;padding:20px;text-decoration:none;border-top:1px solid var(--border);position:relative}.row:hover{background:var(--surface-hover)}.row.selected{background:var(--secondary)}.row strong{font-weight:500;display:block;margin:4px 0}.row .meta{display:flex;justify-content:space-between;gap:8px}.row p{font-size:12px;color:var(--muted);margin-top:6px}.panel{background:var(--surface);border-radius:16px;padding:28px}.meta{font-size:12px;color:var(--muted)}.detail-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}.status{display:inline-flex;align-items:center;gap:6px;font-size:12px}.status svg{width:15px;height:15px}.next{padding:20px;background:var(--background);border-radius:12px;margin:24px 0}.next h3{color:var(--muted);font-size:12px;margin:0 0 6px;font-weight:500}.next p{font-size:16px;font-weight:500}.checks{margin:20px 0 24px}.check{display:flex;align-items:start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}.check svg{margin-top:3px}.check.done{color:var(--muted)}.check.done span{text-decoration:line-through}.check-count{float:right;color:var(--muted);font-weight:400;font-size:12px}.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--border-strong);padding-top:20px;margin-top:24px}.foot .btn{flex-shrink:0}details{margin:20px 0}summary{cursor:pointer;font-weight:500}details p{margin-top:10px;color:var(--muted)}.banner{padding:14px 16px;margin:20px 0;background:var(--background);border-radius:12px;display:flex;gap:10px;align-items:start}.banner p{font-size:12px;margin-top:3px;color:var(--muted)}.banner svg{margin-top:2px}.back{margin-bottom:20px;display:inline-flex;gap:8px;align-items:center;text-decoration:none;color:var(--muted)}.b-list .row{padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 160px 24px;gap:20px;align-items:center}.b-list .row strong{font-size:16px}.b-list .row .meta{justify-content:start;gap:16px}.single{max-width:800px;margin:auto}.b-list{max-width:1000px;margin:auto}.field{margin:20px 0}.field label{display:block;font-weight:500;margin-bottom:8px}textarea,input{display:block;width:100%;border:1px solid var(--border-strong);border-radius:12px;padding:12px;background:var(--surface);color:var(--foreground)}textarea{min-height:90px;resize:vertical}input{min-height:44px}.reason{font-size:12px;color:var(--muted);margin:24px 0 0}.reason b{color:var(--foreground);font-weight:500}.compact .panel{padding:20px}.compact .row{padding-top:14px;padding-bottom:14px}.compact .next{margin:16px 0;padding:16px}.mobile .shell{max-width:375px;padding:20px 16px}.mobile .workspace{display:block}.mobile .workspace .list{display:none}.mobile .panel{padding:20px}.mobile .foot{align-items:stretch;flex-direction:column}.mobile .b-list .row{grid-template-columns:minmax(0,1fr) 18px;gap:12px}.mobile .row-extra{display:none}.mobile .mobile-meta{display:block}.empty{padding:72px 24px;text-align:center}.empty p{margin:8px 0 20px;color:var(--muted)}.empty h2{font-size:18px}.mobile-meta{display:none}.mobile-back{display:none}.mobile .mobile-back{display:inline-flex}.saved{background:var(--background);border-radius:12px;padding:20px;margin:20px 0}.saved strong{display:flex;align-items:center;gap:8px}.state-heading{margin-top:24px}h1,h2,h3,p,strong,span{overflow-wrap:anywhere}
@media(max-width:700px){.review{padding:12px 16px;gap:8px}.review strong{width:100%}.review-note{display:none}.review label{flex:1 0 100%;min-width:0}.review select{flex:1;min-width:0}.shell{padding:20px 16px}.apphead{margin-bottom:24px}.workspace{display:block}.workspace .list{display:none}.panel{padding:20px}.titlebar{align-items:start}h1{font-size:22px}.foot{align-items:stretch;flex-direction:column}.foot .btn{width:100%}.b-list .row{grid-template-columns:minmax(0,1fr) 18px;gap:12px;padding:20px}.row-extra{display:none}.mobile-meta{display:block}.mobile-back{display:inline-flex}.next{padding:16px}.review .btn{font-size:12px}.field textarea,.field input{font-size:16px}.reason{margin-top:20px}}
</style></head><body><div id="app"></div>
<script>
const q=new URLSearchParams(location.search),variant=q.get('v')==='b'?'b':'a',state=q.get('state')||'ready',view=q.get('view')||(variant==='b'?'list':'detail');
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const link=(params={})=>{const p=new URLSearchParams(q);for(const [k,v] of Object.entries(params))p.set(k,v);return '?'+p};
const btn=(text,params,primary=false)=>`<a class="btn ${primary?'primary':''}" href="${link(params)}">${text}</a>`;
const states={ready:'Chưa nhận làm',working:'Đang làm · đã lưu',draft:'Bản nháp',handoff:'Lưu bàn giao',saved:'Đã bàn giao',owned:'AI khác đang làm',offline:'Mất kết nối',conflict:'Có bản cập nhật mới',empty:'Danh sách rỗng'};
const tasks=[['LAB-01','Thiết lập backup','Khôi phục trên VM thử','3/5 mục','Sẵn sàng nhận'],['APP-04','Tạo trang dự án cá nhân','Kiểm tra giao diện mobile','3/5 mục','Bạn đang làm'],['WORK-12','Kiểm tra luồng thanh toán','Đợi kết quả kiểm tra','3/5 mục','Claude · VM-02']];
function rows(wide=false){return tasks.map((t,i)=>`<a class="row ${!wide&&i===(state==='owned'?2:Number(q.get('task')||0))?'selected':''}" href="${link({view:'detail',task:String(i),state:i===2?'owned':i===1?'working':'ready'})}"><div><div class="meta"><span>${t[0]} · ${i===2?'Công việc':'Cá nhân'}</span>${!wide?`<span>${t[3]}</span>`:''}</div><strong>${t[1]}</strong><p>${t[2]}</p>${wide?`<small class="mobile-meta">${t[4]} · ${t[3]}</small>`:''}</div>${wide?`<div class="row-extra"><div>${t[4]}</div><small>${t[3]}</small></div>${icon('chevron-right')}`:`<p>${t[4]}</p>`}</a>`).join('')}
function list(wide=false){return `<section class="list ${wide?'b-list':''}" aria-label="Danh sách task"><div class="listhead"><strong>Task chưa xong</strong><small>3 task</small></div><div class="filters" aria-label="Ví dụ bộ lọc"><button class="active" disabled>Tất cả</button><button disabled>Cá nhân</button><button disabled>Công việc</button></div>${rows(wide)}</section>`}
function banner(title,text,name='info'){return `<div class="banner">${icon(name)}<div><strong>${title}</strong><p>${text}</p></div></div>`}
function detail(){const taskIndex=state==='owned'?2:Number(q.get('task')||0),task=tasks[taskIndex]||tasks[0];const owned=state==='owned',handoff=['handoff','offline','conflict'].includes(state),active=['working','draft','handoff','offline','conflict'].includes(state);return `<article class="panel"><div class="detail-head"><span class="meta">${task[0]} · ${taskIndex===2?'Công việc':'Cá nhân'}</span><span class="status">${icon(owned?'lock-keyhole':active?'circle-dot':'circle')}${owned?'Claude · VM-02':active?'Bạn đang làm':'Chưa có người làm'}</span></div><h2>${task[1]}</h2>${owned?banner('Task đang được Claude thực hiện','Bạn có thể xem context. Quyền sửa vẫn thuộc phiên trên VM-02.','lock-keyhole'):''}${state==='saved'?`<div class="saved"><strong>${icon('circle-check')}Đã lưu bàn giao · 10:42</strong><p class="muted">Đã kết thúc phiên. Máy khác có thể nhận làm tiếp.</p></div>`:''}${handoff?handoffForm():`<div class="next"><h3>Bước tiếp theo</h3><p>${owned?'Đợi kết quả kiểm tra':state==='saved'?'Kiểm tra dữ liệu sau khôi phục':task[2]}</p></div><section class="checks"><h3>Checklist <span class="check-count">3/5 đã xong</span></h3>${(taskIndex===2?['Chuẩn bị dữ liệu giả','Chạy kiểm tra API','Kiểm tra kết quả','Đối chiếu trạng thái','Ghi bằng chứng']:taskIndex===1?['Chốt nội dung trang','Dựng bố cục','Thêm liên kết dự án','Kiểm tra giao diện mobile','Review lần cuối']:['Chọn dữ liệu cần backup','Tạo bản sao mã hóa','Kiểm tra file backup','Khôi phục trên VM thử','Kiểm tra dữ liệu sau khôi phục']).map((x,i)=>`<div class="check ${i<3?'done':''}">${icon(i<3?'square-check':'square')}<span>${x}</span></div>`).join('')}</section><details><summary>Lần trước đã làm gì?</summary><p>${taskIndex===0?'Đã tạo bản backup mã hóa và kiểm tra file. Chưa thử khôi phục trên VM khác.':'Đã xong ba mục đầu trong checklist. Tiếp tục kiểm tra và ghi lại kết quả.'}</p><p>Codex · Mac · 09:30</p></details><details><summary>Ghi chú & liên kết</summary><p>Ví dụ dữ liệu giả. Chưa có liên kết PR.</p></details>${state==='draft'?banner('Chưa lưu lên hệ thống','Thay đổi này mới ở bản nháp. Lưu bàn giao để máy khác đọc được.','file-pen-line'):''}<footer class="foot"><small>${owned?'Chỉ xem':state==='draft'?'Có thay đổi chưa lưu':state==='working'?'Đã lưu · 10:30':state==='saved'?'Đã lưu · 10:42':'Bàn giao gần nhất · 09:30'}</small>${owned?'<button disabled>Đang có người làm</button>':btn(active?'Lưu bàn giao':'Nhận làm',{state:active?'handoff':'working'},true)}</footer>`}</article>`}
function handoffForm(){return `<h3 class="state-heading">Lưu bàn giao</h3>${state==='offline'?banner('Chưa gửi được · mất kết nối','Bản nháp vẫn ở máy này. Chưa kết thúc phiên.','wifi-off'):state==='conflict'?banner('Task đã có cập nhật mới','Giữ bản nháp của bạn để đối chiếu trước khi lưu lại.','git-compare-arrows'):''}<div class="field"><label for="done">Đã làm</label><textarea id="done" readonly>Đã khôi phục bản backup trên VM thử.</textarea></div><div class="field"><label for="next">Bước tiếp theo</label><input id="next" readonly value="Kiểm tra dữ liệu sau khôi phục"></div><details><summary>Thêm blocker, bằng chứng, ghi chú riêng</summary><p>Các trường tùy chọn chỉ mở khi cần. Ghi chú riêng không đồng bộ sang Plane.</p></details><div class="foot"><small>Bản nháp · chưa lưu</small>${state==='offline'?'<button disabled>Chờ kết nối để lưu</button>':state==='conflict'?btn('Xem bản mới',{state:'working'}):btn('Lưu & kết thúc phiên',{state:'saved'},true)}</div><div style="margin-top:12px;display:flex;justify-content:space-between;gap:12px">${btn('Quay lại',{state:'draft'})}${!['offline','conflict'].includes(state)?btn('Lưu, tiếp tục làm',{state:'working'}):''}</div>`}
const toolbar=`<aside class="review" aria-label="Công cụ xem thiết kế"><strong>Wireframe · dữ liệu giả</strong><nav class="switch" aria-label="Phương án"><a class="btn" aria-current="${variant==='a'?'page':'false'}" href="${link({v:'a',view:'detail'})}">A · Hai cột</a><a class="btn" aria-current="${variant==='b'?'page':'false'}" href="${link({v:'b',view:'list'})}">B · Từng trang</a></nav><label>Trạng thái<select id="state">${Object.entries(states).map(([v,t])=>`<option value="${v}" ${v===state?'selected':''}>${t}</option>`).join('')}</select></label><label>Khổ<select id="size"><option value="auto">Theo cửa sổ</option value="mobile" ${q.get('size')==='mobile'?'selected':''}>Mobile 375px</option></select></label><p class="review-note">Chỉ đổi màn mẫu · không lưu dữ liệu</p></aside>`;
let content=state==='empty'?`<section class="list empty"><h2>Chưa có task</h2><p>Task mới sẽ xuất hiện ở đây.</p><button disabled>Tạo task</button></section>`:view==='list'?list(true):variant==='a'?`<div class="workspace">${list()}<div><a class="back mobile-back" href="${link({view:'list'})}">${icon('arrow-left')}Danh sách task</a>${detail()}</div></div>`:`<div class="single"><a class="back" href="${link({view:'list'})}">${icon('arrow-left')}Danh sách task</a>${detail()}</div>`;
document.body.className=q.get('size')==='mobile'?'mobile':'';
document.querySelector('#app').innerHTML=toolbar+`<main class="shell"><header class="apphead"><div class="brand">${icon('layers-2')}Task Hub</div><small>Không gian của bạn</small></header><div class="titlebar"><h1>${view==='list'||state==='empty'?'Việc của bạn':'Tiếp tục công việc'}</h1>${view==='list'?'<button disabled>'+icon('plus')+'Tạo task</button>':''}</div>${content}<p class="reason"><b>${variant==='a'?'A · Đổi task ngay bên cạnh.':'B · Tập trung một task mỗi trang.'}</b> ${variant==='a'?'Mobile chuyển sang danh sách → chi tiết.':'Cần quay lại danh sách khi đổi task.'} Các ô nhập và checklist là mẫu tĩnh; nút điều hướng chỉ chuyển trạng thái minh họa.</p></main>`;
document.querySelector('#state').onchange=e=>location.href=link({state:e.target.value,view:'detail',task:'0'});
document.querySelector('#size').onchange=e=>location.href=link({size:e.target.value});
lucide.createIcons();
</script></body></html>
