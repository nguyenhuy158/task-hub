openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Task Hub API
  version: 0.1.0
  description: "REST and MCP share task rules. AI clients use opaque bearer tokens without Origin. Web owners use the
    verified huyab_sso cookie and an email allowlist with a pinned SSO subject. Web mutations require exact Origin
    https://task.huyab.click and X-CSRF-Token from auth/me. Bearer tokens never grant web admin rights. Retry task
    mutations with the identical operation_id and payload. Conflicts require an explicit fresh read. Responses use
    Cache-Control: no-store."
servers:
  - url: http://127.0.0.1:4180
    description: Local Docker or Node API
security:
  - bearerAuth: []
  - ssoCookie: []
tags:
  - name: Projects
  - name: Sessions
  - name: Tasks
  - name: Health
paths:
  /health:
    get:
      operationId: health
      summary: Liveness
      tags:
        - Health
      security: []
      responses:
        "200":
          description: Process responds. Not a readiness or backup guarantee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                ok: true
  /api/v1/projects:
    get:
      operationId: list_projects
      summary: list projects
      description: List visible, non-archived projects. Ordered by UUID ascending; cursor is the last ID, not a date.
      tags:
        - Projects
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: limit
          in: query
          required: false
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Success. New resources also return HTTP 200. Idempotent retries return the originally committed result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
              example:
                items:
                  - id: 22222222-2222-4222-8222-222222222222
                    code: LAB
                    name: Homelab
                    scope: personal
                    completion_rule: evidence
                    version: 1
                    archived_at: null
                next_cursor: null
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "413":
          $ref: "#/components/responses/Error413"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
    post:
      operationId: create_project
      summary: create project
      description: "Create a project in the token scope. Default completion_rule: evidence for personal, production_release
        for work. Project code is unique and immutable."
      tags:
        - Projects
      parameters: []
      responses:
        "200":
          description: Success. New resources also return HTTP 200. Idempotent retries return the originally committed result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
              example:
                id: 22222222-2222-4222-8222-222222222222
                code: LAB
                name: Homelab
                scope: personal
                completion_rule: evidence
                version: 1
                archived_at: null
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
            example:
              operation_id: 11111111-1111-4111-8111-111111111111
              code: LAB
              name: Homelab
              scope: personal
      security:
        - bearerAuth: []
        - ssoCookie: []
          csrfHeader: []
  /api/v1/projects/{project_id}:
    patch:
      operationId: update_project
      summary: update project
      description: Update project name or completion rule at base_version. Scope cannot change. A request without changed
        fields still increments version.
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      responses:
        "200":
          description: Success. New resources also return HTTP 200. Idempotent retries return the originally committed result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
              example:
                id: 22222222-2222-4222-8222-222222222222
                code: LAB
                name: My homelab
                scope: personal
                completion_rule: evidence
                version: 2
                archived_at: null
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
            example:
              operation_id: 11111111-1111-4111-8111-111111111111
              base_version: 1
              name: My homelab
      security:
        - bearerAuth: []
        - ssoCookie: []
          csrfHeader: []
  /api/v1/sessions:
    post:
      operationId: open_session
      summary: open session
      description: Create a session bound to the authenticated client. A client cannot use another client session.
      tags:
        - Sessions
      parameters: []
      responses:
        "200":
          description: Success. New resources also return HTTP 200. Idempotent retries return the originally committed result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              example:
                id: 44444444-4444-4444-8444-444444444444
                label: Codex on Mac
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenSessionRequest"
            example:
              operation_id: 11111111-1111-4111-8111-111111111111
              label: Codex on Mac
      security:
        - bearerAuth: []
        - ssoCookie: []
          csrfHeader: []
  /api/v1/tasks:
    get:
      operationId: list_tasks
      summary: list tasks
      description: List non-archived tasks in token scope. query searches title and code case-insensitively. Ordered by UUID
        ascending. Results omit checklist, scope and completion_rule; fetch a task for those fields.
      tags:
        - Tasks
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: limit
          in: query
          required: false
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - personal
              - work
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - todo
              - in_progress
              - blocked
              - done
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Success. New resources also return HTTP 200. Idempotent retries return the originally committed result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
              example:
                items:
                  - id: 33333333-3333-4333-8333-333333333333
                    code: LAB-1
                    project_id: 22222222-2222-4222-8222-222222222222
                    title: Restore backup
                    status: in_progress
                    completion_evidence: null
                    version: 2
                    owner_session_id: 44444444-4444-4444-8444-444444444444
                    generation: 2
                    created_at: 2026-10-22T00:00:00.000Z
                    updated_at: 2026-10-22T00:00:00.000Z
                    archived_at: null
                next_cursor: null
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "413":
          $ref: "#/components/responses/Error413"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
    post:
      operationId: create_task
      summary: create task
      description: Create task and initial checklist atomically. No synthetic checkpoint is created. Code is generated from
        the project code.
      tags:
        - Tasks
      parameters: []
      responses:
        "200":
          description: Success. New resources also return HTTP 200. Idempotent retries return the originally committed result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
              example:
                id: 33333333-3333-4333-8333-333333333333
                code: LAB-1
                project_id: 22222222-2222-4222-8222-222222222222
                title: Restore backup
                status: todo
                completion_evidence: null
                version: 1
                owner_session_id: null
                generation: 1
                created_at: 2026-10-22T00:00:00.000Z
                updated_at: 2026-10-22T00:00:00.000Z
                archived_at: null
                scope: personal
                completion_rule: evidence
                checklist:
                  - id: 55555555-5555-4555-8555-555555555555
                    text: Restore on test VM
                    done: false
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
            example:
              operation_id: 11111111-1111-4111-8111-111111111111
              project_id: 22222222-2222-4222-8222-222222222222
              title: Restore backup
              checklist:
                - Restore on test VM
      security:
        - bearerAuth: []
        - ssoCookie: []
          csrfHeader: []
  /api/v1/tasks/{task_id}:
    get:
      operationId: get_task
      summary: get task
      description: Read task, checklist, owner and current version. Archived tasks remain readable by ID.
      tags:
        - Tasks
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      responses:
        "200":
          description: Success. New resources also return HTTP 200. Idempotent retries return the originally committed result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
              example:
                id: 33333333-3333-4333-8333-333333333333
                code: LAB-1
                project_id: 22222222-2222-4222-8222-222222222222
                title: Restore backup
                status: in_progress
                completion_evidence: null
                version: 2
                owner_session_id: 44444444-4444-4444-8444-444444444444
                generation: 2
                created_at: 2026-10-22T00:00:00.000Z
                updated_at: 2026-10-22T00:00:00.000Z
                archived_at: null
                scope: personal
                completion_rule: evidence
                checklist:
                  - id: 55555555-5555-4555-8555-555555555555
                    text: Restore on test VM
                    done: false
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "413":
          $ref: "#/components/responses/Error413"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
    patch:
      operationId: update_task
      summary: update task
      description: "Owner-only update using session_id, generation and base_version. checklist replaces the full list: retain
        existing IDs, omit an ID for a new item; omitted existing items are removed. To set done, provide
        completion_evidence.kind matching the project completion_rule. Evidence is declared by the client, not
        independently verified."
      tags:
        - Tasks
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      responses:
        "200":
          description: Success. New resources also return HTTP 200. Idempotent retries return the originally committed result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
              example:
                id: 33333333-3333-4333-8333-333333333333
                code: LAB-1
                project_id: 22222222-2222-4222-8222-222222222222
                title: Restore backup and document results
                status: in_progress
                completion_evidence: null
                version: 3
                owner_session_id: 44444444-4444-4444-8444-444444444444
                generation: 2
                created_at: 2026-10-22T00:00:00.000Z
                updated_at: 2026-10-22T00:00:00.000Z
                archived_at: null
                scope: personal
                completion_rule: evidence
                checklist:
                  - id: 55555555-5555-4555-8555-555555555555
                    text: Restore on test VM
                    done: false
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
            example:
              operation_id: 11111111-1111-4111-8111-111111111111
              base_version: 2
              session_id: 44444444-4444-4444-8444-444444444444
              generation: 2
              title: Restore backup and document results
      security:
        - bearerAuth: []
        - ssoCookie: []
          csrfHeader: []
  /api/v1/tasks/{task_id}/context:
    get:
      operationId: get_task_context
      summary: get task context
      description: Read current task and latest checkpoint in one DB snapshot. checkpoint is null before the first handoff.
        Requesting private notes without read_private returns 403.
      tags:
        - Tasks
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: include_private
          in: query
          required: false
          schema:
            default: false
            type: boolean
      responses:
        "200":
          description: Success. New resources also return HTTP 200. Idempotent retries return the originally committed result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskContext"
              example:
                task:
                  id: 33333333-3333-4333-8333-333333333333
                  code: LAB-1
                  project_id: 22222222-2222-4222-8222-222222222222
                  title: Restore backup
                  status: in_progress
                  completion_evidence: null
                  version: 3
                  owner_session_id: null
                  generation: 3
                  created_at: 2026-10-22T00:00:00.000Z
                  updated_at: 2026-10-22T00:00:00.000Z
                  archived_at: null
                  scope: personal
                  completion_rule: evidence
                  checklist:
                    - id: 55555555-5555-4555-8555-555555555555
                      text: Restore on test VM
                      done: true
                checkpoint:
                  id: 66666666-6666-4666-8666-666666666666
                  task_id: 33333333-3333-4333-8333-333333333333
                  task_version: 3
                  session_id: 44444444-4444-4444-8444-444444444444
                  done: Restore verified
                  next: Write restore guide
                  blocker: ""
                  decisions: Keep encrypted backups
                  created_at: 2026-10-22T00:00:00.000Z
                  evidence: []
                  checklist:
                    - id: 55555555-5555-4555-8555-555555555555
                      text: Restore on test VM
                      done: true
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "413":
          $ref: "#/components/responses/Error413"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
  /api/v1/tasks/{task_id}/checkpoints:
    get:
      operationId: list_checkpoints
      summary: list checkpoints
      description: Immutable history ordered by task_version descending. cursor is the last checkpoint ID from the previous
        page, belonging to this task. Private note is omitted unless explicitly requested and permitted.
      tags:
        - Tasks
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: limit
          in: query
          required: false
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - name: include_private
          in: query
          required: false
          schema:
            default: false
            type: boolean
      responses:
        "200":
          description: Success. New resources also return HTTP 200. Idempotent retries return the originally committed result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckpointPage"
              example:
                items:
                  - id: 66666666-6666-4666-8666-666666666666
                    task_id: 33333333-3333-4333-8333-333333333333
                    task_version: 3
                    session_id: 44444444-4444-4444-8444-444444444444
                    done: Restore verified
                    next: Write restore guide
                    blocker: ""
                    decisions: Keep encrypted backups
                    created_at: 2026-10-22T00:00:00.000Z
                    evidence: []
                    checklist:
                      - id: 55555555-5555-4555-8555-555555555555
                        text: Restore on test VM
                        done: true
                next_cursor: null
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "413":
          $ref: "#/components/responses/Error413"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
    post:
      operationId: save_checkpoint
      summary: save checkpoint
      description: Atomically patch checklist completion flags, append a full immutable snapshot, and optionally release
        ownership. checklist contains unique existing IDs from this task; omitted items remain unchanged. end_session
        does not set status=done. private_note requires read_private permission; omitted keeps the previous note, empty
        string clears the new snapshot only. done and next remain required even when ending the session.
      tags:
        - Tasks
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      responses:
        "200":
          description: Success. New resources also return HTTP 200. Idempotent retries return the originally committed result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckpointSaved"
              example:
                task_id: 33333333-3333-4333-8333-333333333333
                checkpoint_id: 66666666-6666-4666-8666-666666666666
                version: 3
                generation: 3
                owner_session_id: null
                status: in_progress
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
