  /api/v1/auth/me:
    get:
      operationId: web_current_user
      summary: Current allowed web owner and CSRF token
      security:
        - ssoCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - sub
                  - email
                  - expires_at
                  - csrf_token
                properties:
                  sub: &a1
                    type: string
                  email:
                    type: string
                    format: email
                  expires_at:
                    type: integer
                  csrf_token: *a1
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
