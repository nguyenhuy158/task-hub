  /api/v1/tasks/{task_id}/close-owner:
    post:
      operationId: close_owner
      summary: Owner confirms revoking the exact task owner
      description: Only the web owner may call this endpoint. Confirmation must use the task version, owner session and
        generation shown to the user. Stale confirmation returns 409. Retry with the same operation_id and payload.
      security:
        - ssoCookie: []
          csrfHeader: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operation_id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                base_version:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 9007199254740991
                expected_owner_session_id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                expected_generation:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 9007199254740991
              required:
                - operation_id
                - base_version
                - expected_owner_session_id
                - expected_generation
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - id
                  - version
                properties:
                  id:
                    type: string
                    format: uuid
                  version:
                    type: integer
                    minimum: 1
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque per-client token provisioned by the local owner; never put in URLs.
    ssoCookie:
      type: apiKey
      in: cookie
      name: huyab_sso
      description: RS256 SSO JWT. Verified issuer, audience, expiry, allowed email and pinned subject.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Obtain from auth/me; bound to the current SSO cookie. Web mutations also require exact Origin
        https://task.huyab.click.
  schemas:
    Project:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        scope:
          type: string
          enum:
            - personal
            - work
        completion_rule:
          type: string
          enum:
            - evidence
            - production_release
        version:
          type: integer
          minimum: 1
        archived_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - code
        - name
        - scope
        - completion_rule
        - version
        - archived_at
    Session:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
      required:
        - id
        - label
    ChecklistItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        done:
          type: boolean
      required:
        - id
        - text
        - done
    TaskSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        project_id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum:
            - todo
            - in_progress
            - blocked
            - done
        completion_evidence:
          type:
            - string
            - "null"
          description: Current wire format is serialized JSON text, not an object. Parse only when non-null. The object contains
            kind and value.
        version:
          type: integer
          minimum: 1
        owner_session_id:
          type:
            - string
            - "null"
          format: uuid
        generation:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - code
        - project_id
        - title
        - status
        - completion_evidence
        - version
        - owner_session_id
        - generation
        - created_at
        - updated_at
        - archived_at
    Task:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        project_id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum:
            - todo
            - in_progress
            - blocked
            - done
        completion_evidence:
          type:
            - string
            - "null"
          description: Current wire format is serialized JSON text, not an object. Parse only when non-null. The object contains
            kind and value.
        version:
          type: integer
          minimum: 1
        owner_session_id:
          type:
            - string
            - "null"
          format: uuid
        generation:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type:
            - string
            - "null"
          format: date-time
        scope:
          type: string
          enum:
            - personal
            - work
        completion_rule:
          type: string
          enum:
            - evidence
            - production_release
        checklist:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
      required:
        - id
        - code
        - project_id
        - title
        - status
        - completion_evidence
        - version
        - owner_session_id
        - generation
        - created_at
        - updated_at
        - archived_at
        - scope
        - completion_rule
        - checklist
    Evidence:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            kind:
              const: text
              type: string
            value:
              type: string
          required:
            - kind
            - value
        - type: object
          additionalProperties: false
          properties:
            kind:
              const: url
              type: string
            value:
              type: string
              format: uri
              pattern: ^https?://
          required:
            - kind
            - value
    Checkpoint:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        task_version:
          type: integer
          minimum: 1
        session_id:
          type: string
          format: uuid
        done:
          type: string
        next:
          type: string
        blocker:
          type: string
        decisions:
          type: string
        created_at:
          type: string
          format: date-time
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        checklist:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
        private_note:
          type: string
          description: Omitted by default. Present only when include_private=true and the client has read_private permission.
      required:
        - id
        - task_id
        - task_version
        - session_id
        - done
        - next
        - blocker
        - decisions
        - created_at
        - evidence
        - checklist
    TaskContext:
      type: object
      additionalProperties: false
      properties:
        task:
          $ref: "#/components/schemas/Task"
        checkpoint:
          anyOf:
            - $ref: "#/components/schemas/Checkpoint"
            - type: "null"
      required:
        - task
        - checkpoint
    CheckpointSaved:
      type: object
      additionalProperties: false
      properties:
        task_id:
          type: string
          format: uuid
        checkpoint_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        generation:
          type: integer
          minimum: 1
        owner_session_id:
          type:
            - string
            - "null"
          format: uuid
        status:
          type: string
          enum:
            - todo
            - in_progress
            - blocked
            - done
      required:
        - task_id
        - checkpoint_id
        - version
        - generation
        - owner_session_id
        - status
    ProjectPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        next_cursor:
          type:
            - string
            - "null"
          format: uuid
      required:
        - items
        - next_cursor
    TaskPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskSummary"
        next_cursor:
          type:
            - string
            - "null"
          format: uuid
      required:
        - items
        - next_cursor
    CheckpointPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Checkpoint"
        next_cursor:
          type:
            - string
            - "null"
          format: uuid
      required:
        - items
        - next_cursor
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
                - INVALID_INPUT
                - INVALID_JSON
                - PATH_BODY_MISMATCH
                - INVALID_CURSOR
                - INVALID_CHECKLIST
                - COMPLETION_EVIDENCE_REQUIRED
                - UNAUTHENTICATED
                - FORBIDDEN
                - BROWSER_ORIGIN_NOT_ENABLED
                - ORIGIN_NOT_ALLOWED
                - CSRF_INVALID
                - WEB_AUTH_DISABLED
                - NOT_FOUND
                - VERSION_CONFLICT
                - OWNER_CHANGED
                - TASK_OWNED
                - OPERATION_REUSED
                - TASK_ARCHIVED
                - PROJECT_ARCHIVED
                - CODE_EXISTS
                - PAYLOAD_TOO_LARGE
                - JSON_REQUIRED
                - RETRY_LATER
                - INTERNAL_ERROR
            fields:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  path:
                    type: array
                    items:
                      type:
                        - string
                        - integer
                  code:
                    type: string
                required:
                  - path
                  - code
          required:
            - code
      required:
        - error
    Health:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
      required:
        - ok
    CreateProjectRequest:
      type: object
      properties:
        operation_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9]{1,11}$
        name:
          type: string
          minLength: 1
          maxLength: 120
        scope:
          type: string
          enum:
            - personal
            - work
        completion_rule:
          type: string
          enum:
            - evidence
            - production_release
      required:
        - operation_id
        - code
        - name
        - scope
      additionalProperties: false
    UpdateProjectRequest:
      type: object
      properties:
        operation_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        base_version:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        name:
          type: string
          minLength: 1
          maxLength: 120
        completion_rule:
          type: string
          enum:
            - evidence
            - production_release
      required:
        - operation_id
        - base_version
      additionalProperties: false
    OpenSessionRequest:
      type: object
      properties:
        operation_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        label:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - operation_id
        - label
      additionalProperties: false
    CreateTaskRequest:
      type: object
      properties:
        operation_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        project_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        title:
          type: string
          minLength: 1
          maxLength: 120
        checklist:
          default: []
          maxItems: 200
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 500
      required:
        - operation_id
        - project_id
        - title
      additionalProperties: false
    ClaimTaskRequest:
      type: object
      properties:
        operation_id:
