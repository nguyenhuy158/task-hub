  /api/v1/auth/logout:
    post:
      operationId: web_logout
      summary: Prepare global SSO logout
      description: Requires valid web auth, exact Origin and CSRF header. Navigate the browser to redirect_url to clear the
        shared SSO cookie and log out of all SSO apps. This response alone does not clear the cookie or revoke an issued
        JWT.
      security:
        - ssoCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - redirect_url
                properties:
                  redirect_url:
                    type: string
                    format: uri
        "400":
          $ref: "#/components/responses/Error400"
        "401":
